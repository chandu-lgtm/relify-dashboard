function personaOf(t){var s=t.toLowerCase();
  if(/cmo|marketing/.test(s))return 'Marketing';
  if(/coo|operating|operations|general manager|\bgm\b/.test(s))return 'Operations';
  if(/founder|owner|\bceo\b|president|chief executive/.test(s))return 'Owner/CEO';
  if(/cio|cto|technolog|information officer/.test(s))return 'Tech';
  return 'Other';}
// How recently someone posts is the strongest predictor we have of whether they
// convert: you can only comment on someone who posts, and prospects commented on
// before the invite are accepting far better than cold ones. This used to be a
// hardcoded 0/10 labelled "not measured yet", which meant a prospect who posts
// daily scored identically to one who has never posted once.
// days: days since their last post, -1 for never posted, null unmeasured.
// usable: false when they post often but the content cannot be engaged with
//   (advertising, event flyers, bare reposts, wrong language, off-ICP topics).
//   Frequency alone is not a buying signal: someone posting a driveway ad every
//   day is no more reachable than someone silent, so they are capped low.
// WEIGHTING, rebalanced 2026-08-18. Activity is worth 40 of 100, more than any
// other factor, because this engagement is paid on booked demos and a perfect-fit
// prospect who last posted years ago cannot produce one soon. Under the old
// 40/35/15/10 split, fit alone was 90 points, so a five-years-dormant CIO still
// scored 87 and sat near the top of the list. Fit says whether they are worth
// talking to; activity says whether a conversation can actually be started now.
// engaged: 'replied' | 'accepted' | null. A prospect who has actually responded to
// us is PROVEN reachable, which is the whole thing this component tries to predict
// from posting habits. Without this, Sabina (our only accepted connection) and
// Emily (three comments and a live two-way thread) both scored 58 and sat near the
// bottom of the list, below people who merely post often. Proof beats proxy.
function activityScore(days,usable,engaged){
  if(engaged==='replied')return [40,'Already in a two-way conversation with us. The warmest prospect type there is'];
  if(engaged==='accepted')return [38,'Accepted our connection request, so they are proven reachable'];
  if(days===null||days===undefined)return [16,'Not checked yet. Scored neutrally so an unknown is not treated as a dead lead'];
  if(days<0)return [0,'Has never posted. No way in except a connection note, and no signal they read LinkedIn'];
  if(usable===false)return [8,'Posts regularly, but it is advertising or reposts with nothing to engage with'];
  if(days<=7)return [40,'Posted in the last week. Commentable now, and warm touches land best here'];
  if(days<=14)return [30,'Posted within 14 days, just inside the freshness limit for a comment'];
  if(days<=30)return [16,'Last posted about '+Math.round(days/7)+' weeks ago. Too stale to comment on'];
  if(days<=90)return [8,'Last posted about '+Math.round(days/30)+' months ago. Effectively dormant'];
  return [4,'Last posted over 3 months ago. Dormant, so a demo from here is unlikely soon'];
}

  var why=[

// persist() is called on every render: always cache locally; push to the shared API only
// once we're "ready" (after the first server reconcile) so the initial paint of an empty
// device can never overwrite real data on the server.
// _epoch counts local edits. Any edit made while a server pull is in flight makes that
// pull's (now-stale) result get discarded, so your click can never be overwritten.
var _saveTimer=null,_epoch=0;
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(snapshot()));}catch(e){}if(!S._suppressSave){_epoch++;if(S._ready)scheduleSave();}}

function saveServer(){_saveTimer=null;try{fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:snapshot()})}).catch(function(){});}catch(e){}}
// Reconcile with the shared state. Rules:
//  - you edited during the fetch -> your change wins; push it up
//  - server has data            -> apply it (server wins)
//  - server is empty            -> seed it from this device so it's never blank
//  - request failed             -> keep local; still allow future saves
function loadServer(){try{var e=_epoch;fetch('/api/state').then(function(r){return r.ok?r.json():null;}).then(function(j){
  if(_epoch!==e){S._ready=true;saveServer();return;}   // local edit happened mid-fetch -> your change wins
  if(j&&j.state){
    S._suppressSave=true;applySnapshot(j.state);render();S._suppressSave=false;
    try{localStorage.setItem(LS_KEY,JSON.stringify(snapshot()));}catch(e2){}
    S._ready=true;
  }else{
    S._ready=true;saveServer();                        // server empty -> seed from this device
  }
}).catch(function(){S._ready=true;});}catch(e){S._ready=true;}}

function queuedPostCard(a){
  // Same rule as actCard: once it is published the text is public, so the
  // editor closes. Guards the case where a sync marks it posted mid-edit.
  var editing=(S.editActId===a.id&&!a.posted);
  var st=a.status||'pending';
  var badge = st==='approved' ? (a.posted?'POSTED':'APPROVED') : (st==='rejected'?'REJECTED':'AWAITING YOUR APPROVAL');
  var bg = st==='approved' ? 'var(--teal-tint)' : (st==='rejected'?'#FDECEC':'var(--amber-tint)');
  var col= st==='approved' ? 'var(--teal-h)'   : (st==='rejected'?'var(--danger)':'var(--amber-tx)');
  var slot=nextPostSlot();
  var body = editing
    ? '<textarea id="actEdit_'+a.id+'" class="f" style="width:100%;min-height:190px;line-height:1.6;font-size:13px;padding:11px 13px">'+esc(a.text)+'</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-teal btn-sm" onclick="A.saveActivityEdit(\''+a.id+'\')">Save draft</button><button class="btn btn-out btn-sm" onclick="A.editActivity(\''+a.id+'\')">Cancel</button></div>'
    : '<div style="font-size:13px;line-height:1.65;color:var(--ink2);white-space:pre-wrap">'+esc(a.text)+'</div>';
  var why='<div style="border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:12px"><div class="eyebrow" style="margin-bottom:5px">Why post this</div><div style="font-size:12.5px;line-height:1.55;color:var(--ink2)">'+esc(a.reason)+'</div></div>';
  var actions='';
  // While the editor is open, show only Save/Cancel. Rendering the status
  // actions underneath an open textarea let you hit "Mark posted" mid-edit.
  if(editing){
    actions='';
  } else if(st==='pending'){
    actions='<div style="display:flex;gap:8px;margin-top:13px;border-top:1px solid var(--border-soft);padding-top:12px;flex-wrap:wrap"><button class="btn btn-teal btn-sm" onclick="A.approveActivity(\''+a.id+'\')">Approve</button><button class="btn btn-out teal btn-sm" onclick="A.editActivity(\''+a.id+'\')">Edit</button><button class="btn btn-sm" style="border:1px solid var(--danger-bd);background:#fff;color:var(--danger)" onclick="A.rejectActivity(\''+a.id+'\')">Reject</button></div>';
  } else if(st==='approved'&&a.posted){
    actions='<div style="display:flex;align-items:center;gap:10px;margin-top:12px;border-top:1px solid var(--border-soft);padding-top:12px;flex-wrap:wrap"><span style="font-size:12px;color:var(--green-tx);font-weight:700">✓ Published '+esc(a.posted)+'</span><div class="spacer"></div><button class="btn btn-out btn-sm" onclick="A.unmarkPosted(\''+a.id+'\')">Undo</button></div>';
  } else if(st==='approved'){
    // Edit stays available after approval, up until it actually publishes.
    // Approving is not the same as finishing: you often spot a wording change
    // afterwards, and without this the only route was Reopen, which looks like
    // withdrawing approval and re-queues the item.
    actions='<div style="display:flex;align-items:center;gap:10px;margin-top:12px;border-top:1px solid var(--border-soft);padding-top:12px;flex-wrap:wrap"><span style="font-size:12px;color:var(--green-tx);font-weight:700">✓ Approved, goes out '+esc(slot.label)+'</span><div class="spacer"></div><button class="btn btn-out teal btn-sm" onclick="A.editActivity(\''+a.id+'\')">Edit</button><button class="btn btn-teal btn-sm" onclick="A.markPosted(\''+a.id+'\')">Mark posted</button><button class="btn btn-out btn-sm" onclick="A.reopenActivity(\''+a.id+'\')">Reopen</button></div>';
  } else if(st==='rejected'){
    actions='<div style="display:flex;align-items:center;gap:10px;margin-top:12px;border-top:1px solid var(--border-soft);padding-top:12px"><span style="font-size:12px;color:var(--danger);font-weight:700">Rejected, will not be published</span><div class="spacer"></div><button class="btn btn-out btn-sm" onclick="A.reopenActivity(\''+a.id+'\')">Reopen</button></div>';
  }
  return '<div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge" style="background:'+bg+';color:'+col+'">'+badge+'</span><span class="mono" style="font-size:11.5px;color:var(--faint);font-weight:700">'+esc(a.name||'Post')+'</span><div class="spacer"></div><span class="mono" style="font-size:11.5px;color:var(--faint);font-weight:700">'+esc(slot.label)+'</span></div>'+body+why+actions+'</div>';
}

}

// vPlanModal removed 2026-08-05: the "Run Agent" button ran a simulated session, not a real one. Client flagged it as confusing.
function vEditorModal(){if(!S.editorOpen)return '';var p=S.editorIdx!=null?S.people[S.editorIdx]:null;return '<div class="overlay" onclick="A.closeEditor()"><div class="modal" style="width:520px" onclick="event.stopPropagation()"><div style="font-weight:800;font-size:16px">'+(p?'Edit prospect':'Add prospect')+'</div><div class="page-sub" style="margin-bottom:16px">Manually added prospects follow the same rules - no outreach happens until they\'re approved.</div><div style="display:flex;flex-direction:column;gap:13px"><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">Full name <span style="color:var(--danger)">*</span></div><input id="eName" class="f" placeholder="e.g. Priya Iyer" value="'+esc(p?p.name:'')+'"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">Title</div><input id="eTitle" class="f" placeholder="e.g. CMO" value="'+esc(p?p.title:'')+'"></div><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">Company</div><input id="eCompany" class="f" placeholder="e.g. Acme Marketing" value="'+esc(p&&p.company!=='-'?p.company:'')+'"></div></div><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">LinkedIn URL</div><input id="eLi" class="f" placeholder="https://www.linkedin.com/in/…" value="'+esc(p?p.li:'')+'"></div></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-teal" style="height:38px" onclick="A.saveEditor()">'+(p?'Save changes':'Add prospect')+'</button><button class="btn btn-out" style="height:38px" onclick="A.closeEditor()">Cancel</button></div></div></div>';}

function vBulkModal(){if(!S.bulkOpen)return '';var n=Object.keys(S.selected).length;
  return '<div class="overlay" onclick="A.bulkEditClose()"><div class="modal" style="width:480px" onclick="event.stopPropagation()"><div style="font-weight:800;font-size:16px">Bulk edit '+n+' prospect'+(n>1?'s':'')+'</div><div class="page-sub" style="margin-bottom:16px">Set a field for every selected prospect. Leave a field on &ldquo;No change&rdquo; to keep it as-is.</div><div style="display:flex;flex-direction:column;gap:13px"><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">Approval</div><select id="bAppr" class="f"><option value="">No change</option><option value="Approved">Approve</option><option value="Pending">Set to pending</option></select></div><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">Pipeline stage</div><select id="bStage" class="f"><option value="">No change</option>'+['Sourced','Warming','Connected','Conversation','Meeting set'].map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select></div><div><div style="font-size:12px;font-weight:800;margin-bottom:5px">Role / segment</div><select id="bRole" class="f"><option value="">No change</option>'+['Marketing','Operations','Owner/CEO','Tech'].map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select></div></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-teal" style="height:38px" onclick="A.bulkEditApply()">Apply to '+n+'</button><button class="btn btn-out" style="height:38px" onclick="A.bulkEditClose()">Cancel</button></div></div></div>';}
function render(){
  persist();
  var body;switch(S.screen){case 'prospects':body=vProspects();break;case 'activity':body=vActivity();break;case 'strategy':body=vStrategy();break;case 'content':body=vContent();break;case 'conversations':body=vConversations();break;case 'analytics':body=vAnalytics();break;default:body=vDashboard();}
  document.getElementById('app').innerHTML='<div class="app">'+vSidebar()+'<div class="main">'+vTopbar()+'<main class="scroll">'+body+'</main></div></div>'+vEditorModal()+vBulkModal()+(S.toast?'<div class="toast">'+esc(S.toast)+'</div>':'');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(S.bulkOpen){S.bulkOpen=false;render();}else if(S.editorOpen){S.editorOpen=false;render();}}});
loadState();
render();
loadServer();
// Pick up changes made on other devices when this tab regains focus.
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadServer();});
window.addEventListener('focus',loadServer);
</script>
</body>
</html>
